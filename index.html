<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micha en AnneWil</title>
    <!-- Google Fonts voor de Amerikaanse Bruiloftsstijl -->
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    
    <style>
        /* --- CSS STYLING --- */
        :root {
            --gold: #D4AF37;
            --dark-gold: #AA8C2C;
            --cream: #F9F9F7;
            --text-dark: #333333;
            --text-light: #666666;
        }

        body, html {
            margin: 0;
            padding: 0;
            min-height: 100%;
            font-family: 'Playfair Display', serif;
            background-color: var(--cream);
            color: var(--text-dark);
            overflow-x: hidden;
        }

        /* Achtergrond met subtiel kleurverloop */
        .bg-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(249,249,247,1) 100%);
            z-index: -1;
        }

        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
            box-sizing: border-box;
            animation: fadeIn 2s ease-in;
        }

        /* Decoratieve lijn */
        .divider {
            width: 150px;
            height: 2px;
            background-color: var(--gold);
            margin: 20px auto;
        }

        h1 {
            font-family: 'Great Vibes', cursive;
            font-size: 5rem;
            color: var(--gold);
            margin: 0;
            line-height: 1.2;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        h2 {
            font-size: 1.5rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: var(--text-dark);
            margin-top: 10px;
            font-weight: 400;
        }

        p.date {
            font-size: 1.2rem;
            color: var(--text-light);
            font-style: italic;
            margin-bottom: 30px;
        }

        /* Vergrote Responsieve Container voor de Fotopresentatie */
        .presentation-wrapper {
            width: 100%;
            max-width: 1900px; /* Vergroot voor een grotere weergave */
            aspect-ratio: 16 / 9;
            margin: 15px auto 35px auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 35px rgba(212, 175, 55, 0.3);
            border: 2px solid var(--gold);
        }

        .presentation-wrapper iframe {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
        }

        /* De Knop naar Google Foto's */
        .photo-btn {
            display: inline-block;
            text-decoration: none;
            background-color: var(--gold);
            color: white;
            padding: 15px 40px;
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            border-radius: 50px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            border: 2px solid var(--gold);
        }

        .photo-btn:hover {
            background-color: white;
            color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
        }

        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #999;
        }

        /* Animatie */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobiele aanpassingen */
        @media (max-width: 600px) {
            h1 { font-size: 3.5rem; }
            h2 { font-size: 1.1rem; letter-spacing: 2px; }
            .container { padding: 30px 15px; }
        }
    </style>
</head>
<body>

    <div class="bg-overlay"></div>

    <div class="container">
        <!-- Titel Sectie -->
        <h2>Micha's tijdlijn</h2>
        <div class="divider"></div>
        
        <h1>Micha en AnneWil</h1>
        
        <div class="divider"></div>
        
        <p class="date">7 november, 2026</p>

        <!-- Google Slides Presentatie -->
        <div class="presentation-wrapper">
            <iframe src="https://docs.google.com/presentation/d/e/2PACX-1vRGWeNpSidzQTRSdt6T8MddEe9rCq0XZa5s4fTdD-h3CKsSN77gIQWuM1JWylBoxsDVyBDverdONw0y/pubembed?start=true&loop=true&delayms=3000" allowfullscreen="true" mozallowfullscreen="true" webkitallowfullscreen="true"></iframe>
        </div>

        <p style="max-width: 600px; line-height: 1.6; color: #555; margin-bottom: 30px;">
            We vinden het leuk om jullie een kijkje in het leven van Micha te geven!
        </p>

        <!-- Knop naar jouw Google Album -->
        <a href="https://photos.app.goo.gl/GwXgYtC7tuL9KUyz6" target="_blank" rel="noopener noreferrer" class="photo-btn">
            Bekijk de foto's
        </a>

        <div class="footer">
            Made with love
        </div>
    </div>

</body>
</html>
